<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Final project - task 1</title>
</head>
<body>
<div class="container">
    <div class="content">
        <div>
            <h2>Test</h2>
            <label for="inputPair">Name/Value Pair
                <div class="text-input-wrapper">
                    <input type="text" name="inputPair" id="inputPair" required>
                    <button id="addButton" type="button">Add</button>
                </div>
            </label>
        </div>
        <div>
            <label>Name/Value Pair list</label>
            <div class="text-area-wrapper">
                <select id="pairsList" class="pairs-list" multiple size="10" aria-label="Name/value pair list"></select>
                <div class="button-container">
                    <button id="sortByNameButton" type="button">Sort by Name</button>
                    <button id="sortByValueButton" type="button">Sort by Value</button>
                    <button id="deleteButton" type="button">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="index.js" type="module"></script>
</body>
</html>
